<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 🥺</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- 🎬 Intro Video -->
<div id="videoScreen">
  <video id="introVideo" autoplay muted playsinline>
    <source src="video/intro.mp4" type="video/mp4">
  </video>
</div>


  <!-- 🎵 Background Music (played after YES) -->
  <audio id="bgMusic" loop>
    <source src="song.mp3.mpeg" type="audio/mpeg">
  </audio>

  <!-- 🎵 Gift 3 Letter Music -->
  <audio id="letterMusic" loop>
    <source src="songs/song3.mp3" type="audio/mpeg">
  </audio>

  <!-- 💖 Main Valentine Card -->
  <div class="container hidden" id="mainContent">

    <img src="photos/us.jpeg" alt="Us" class="couple-photo">

    <h1>HEYYY <span class="name">MY LITTLE STAR</span></h1>
    <h2>Will you be my Valentine? 💝</h2>

    <div class="buttons">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 😭</button>
    </div>

    <p id="cryEmoji">😭</p>
    <p id="threat"></p>
    <p id="message"></p>
    <button id="openGiftsBtn" class="hidden">Open this 🎁</button>

  </div>

  <canvas id="confetti"></canvas>

  <!-- 🎁 Gift Popup -->
  <div id="giftModal" class="modal hidden">
    <div class="modal-content">
      <h3>Something for You</h3>

      <div class="gift-grid">
        <img src="photos/always.jpeg" class="gift-img" onclick="openGift('quiz')">
        <img src="photos/forever.jpeg" class="gift-img" onclick="openGift('memories')">
        <img src="photos/us.jpeg" class="gift-img" onclick="openGift('letter')">
      </div>

      <div id="giftContent"></div>

      <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
  </div>

  <!-- 🖼️ Memories -->
  <div id="memoryModal" class="modal hidden">
    <div class="modal-content memory-content">

      <h3>Some moments I love the most 💕</h3>

      <div class="polaroid-chain">
        <div class="polaroid"><img src="photos/aayo.jpeg"><p onclick="playMemorySong(1)">That beginning 💗</p></div>
        <div class="polaroid"><img src="photos/dhan.jpeg"><p onclick="playMemorySong(2)">Soft smiles</p></div>
        <div class="polaroid"><img src="photos/ooty.jpeg"><p onclick="playMemorySong(3)">Favourite day</p></div>
      </div>

      <div class="polaroid-chain">
        <div class="polaroid"><img src="photos/payo.jpeg"><p onclick="playMemorySong(4)">Us energy ✨</p></div>
        <div class="polaroid"><img src="photos/prem.jpeg"><p onclick="playMemorySong(5)">Where I belong</p></div>
        <div class="polaroid"><img src="photos/always.jpeg"><p onclick="playMemorySong(6)">Always & forever</p></div>
      </div>

      <button class="close-btn" onclick="closeMemory()">Close</button>
    </div>
  </div>

  <!-- 📰 Letter -->
  <div id="letterModal" class="modal hidden">
    <div class="modal-content letter-content">
      <button class="close-btn" onclick="closeLetter()">Close</button>
      <iframe src="Brown Illustrated Newspaper Trifold Brochure.pdf"
              style="width:100%; height:90vh; border:none;"></iframe>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
